version=v1.4.70
summary=字域 v1.4.70：修复系统更新后的字体应用、粗细冲突和返回稳定性
notes=相较正式版 v1.4.58：打开 App 轻量检查系统更新，确认变化后后台重扫原厂字体，正常情况不重复扫描；修复手动扫描与字体应用状态不同步。主页粗细改为提示到系统设置调整，修改字号和 DPI 不再影响粗细。新增按字体开启的 ColorOS 防裁切，默认关闭、开启后需重新应用，主要面向静态字体。改善缺少系统要求字重时的兼容处理和模块连接流程。返回按实际来源并保留筛选/滚动，修正玻璃采样与重复状态注册闪退，统一字体名称、按钮和搜索间距。请更新完整模块 ZIP 并重启；正式包与其他机型仍需继续验收。
