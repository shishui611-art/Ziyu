version=v1.4.83
summary=字域 v1.4.83：字体挂载、模块升级与界面兼容改进
notes=相较上一正式版 v1.4.70：兼容新版 NoMount Suite 并保留字体校验、挂载验证和失败回滚；修复 ColorOS 17 使用 TTC 字体集合时的兼容别名处理，避免部分字体应用中断；修正旧版升级读取字体状态时的辅助脚本路径，改进可信原厂字体扫描与旧数据迁移，只清理可确认属于字域的旧文件；统一 Root 管理器中的模块名称，刷入默认普通 Root 并可选临时 Root；改进模块按钮启动 App、日志导出、搜索间距、安全体检、自定义预览文字和卡片透明度；修正透明卡片投影色块以及 Android 16.1 实时活动请求的版本判断；按当前模块名称校准 Hybrid Mount 规则与黑名单兼容检查；修复正式发布校验、部署与挂载回归夹具依赖和旧系列更新清单推进问题。未覆盖所有 ROM，遇到问题请导出日志并提供机型、系统版本和 Root 管理器。
