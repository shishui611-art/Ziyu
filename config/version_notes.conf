version=v1.4.19
summary=字域 v1.4.19：修复组合来源覆盖判定与原厂集合验证参数
notes=相较上一正式版 v1.4.2，汇总其后组合字体兼容、挂载回退、用户文件/备份、主题、通知和预加载等工作副本更新。本版修正 inspect_donor 误用 globalUiCandidate 全覆盖门槛的问题：保留“中、大小写英文字母、数字”基础探针，以及轮廓支持和非彩色检查；不再要求全量汉字、常用汉字比例或标点覆盖作为整面替换条件。单字缺少来源字形时仍由既有逐字保留原厂逻辑处理。集合验证 CLI 新增单个实际组合来源 --source Path，校验真实来源并在来源身份变化时拒绝。另修复 app_bridge 普通状态入口的只读状态函数加载缺口，并对可选函数做定义检查；不恢复热切换或改变挂载策略。既有 scripts/app_bridge_status_test.sh 已 exit 0，状态、自挂载失败、过期证明、待重启、Universal 与回滚断言均通过。并包含 v1.4.16 共享字形冲突保留、v1.4.17 有界逐面并行和真实字形容错、v1.4.18 主题对话框及通知点击修正，以及基于已验证挂载清单的预加载修复。十项集合回归、Android Debug 构建、双 ABI 原生构建和本地 51 项包完整性检查通过；Windows 使用 ADB 只读导出的组合及原厂快照完成生产 build CLI 五面生成（全部 PASS），随后 validate --source --require-proof 退出 0 / PASS。桌面单进程 build / validate 分别耗时 278.250 秒 / 12.719 秒，不代表手机耗时或提速。正式 CI 结果仍待定。本轮未进行手机字体切换或显示验收，设备矩阵仍待测。预加载仍要求 Zygisk 执行回调且字体路径可见。
