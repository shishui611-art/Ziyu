name: Withdraw 2.0.0 on maintainer request
on:
  push:
    branches: [main]
    paths: [.github/workflows/withdraw-v2-20260928.yml]
permissions:
  contents: write
concurrency:
  group: ziyu-withdraw-v2-20260928
  cancel-in-progress: false
jobs:
  withdraw:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unpublish exactly the reported release, preserving evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo=xgl34222220-ops/Ziyu
          gh api "repos/$repo/releases/398338417" > "$RUNNER_TEMP/release-before.json"
          test "$(jq -r .tag_name "$RUNNER_TEMP/release-before.json")" = refactor-v2.0.0
          test "$(jq -r .target_commitish "$RUNNER_TEMP/release-before.json")" = fca518e9a00aa0f37daf2b993db80a3bb6b232b6
          jq '{draft:true, name:"[已撤回] 洛书 2.0.0 — HyperOS 英数覆盖回归", body:("# 已撤回：请勿继续分发或安装 2.0.0\n\n维护者于 2026-09-28 报告 HyperOS 英文、数字覆盖回归并要求撤回。保留原始附件、标签及下方发布记录用于排查；没有宣称根因或修复已通过真机验证。修复只进入测试分支，不自动重新发布。\n\n---\n\n" + .body)}' "$RUNNER_TEMP/release-before.json" > "$RUNNER_TEMP/withdraw.json"
          gh api -X PATCH "repos/$repo/releases/398338417" --input "$RUNNER_TEMP/withdraw.json" > "$RUNNER_TEMP/release-after.json"
          test "$(jq -r .draft "$RUNNER_TEMP/release-after.json")" = true
          gh api "repos/$repo/releases/tags/refactor-v1.1.1" > "$RUNNER_TEMP/previous.json"
          test "$(jq -r .draft "$RUNNER_TEMP/previous.json")" = false
          test "$(jq -r .prerelease "$RUNNER_TEMP/previous.json")" = false
          previous=$(jq -r .id "$RUNNER_TEMP/previous.json")
          gh api -X PATCH "repos/$repo/releases/$previous" -f make_latest=true >/dev/null
      - name: Stop online rollout and revoke the old release authorization
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          python3 - <<'PY'
          import json
          from pathlib import Path
          update = {
              'version': 'v1.1.1', 'versionCode': 60101,
              'zipUrl': 'https://github.com/xgl34222220-ops/LuoShu/releases/download/refactor-v1.1.1/LuoShu-v1.1.1.zip',
              'changelog': 'https://raw.githubusercontent.com/xgl34222220-ops/LuoShu/main/docs/WITHDRAWN_2.0.0.md',
          }
          for filename in ('update.json', 'update-prerelease.json'):
              path = Path(filename)
              current = json.loads(path.read_text())
              if current['version'] not in ('v2.0.0', 'v1.1.1'):
                  raise SystemExit('Concurrent newer release detected: ' + filename)
              path.write_text(json.dumps(update, indent=2, ensure_ascii=False) + '\n')
          Path('config/stable_release_authorization.conf').write_text('version=v2.0.0\nscope=withdrawn\nallowPendingDeviceMatrix=false\nreason=maintainer-withdrawal-hyperos-latin-digit-regression-20260928T151554Z\n')
          Path('docs/WITHDRAWN_2.0.0.md').write_text('# 洛书 2.0.0 已撤回\n\n2026-09-28：维护者报告 HyperOS 英文、数字覆盖不全，要求撤回正式版。2.0.0 已取消公开发布，在线更新恢复指向上一公开正式版 1.1.1；这不是对 1.1.1 全部问题已解决的认证，也不会将已安装 2.0.0 自动降级。\n\n请勿继续转发先前的 2.0.0 安装包。修复在独立测试分支进行，保留无常驻及任务退出清理、移除全局粗细调节的要求。未经新的明确授权，不重新公开发布 2.0.0 或替换其附件。\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add update.json update-prerelease.json config/stable_release_authorization.conf docs/WITHDRAWN_2.0.0.md
          git diff --cached --quiet || git commit -m 'release: stop v2 rollout and record withdrawal [skip ci]'
          git push origin HEAD:main
          test "$(gh api repos/xgl34222220-ops/Ziyu/releases/latest --jq .tag_name)" = refactor-v1.1.1
          echo '2.0.0 is draft; public latest and online rollout restored to 1.1.1.' >> "$GITHUB_STEP_SUMMARY"
