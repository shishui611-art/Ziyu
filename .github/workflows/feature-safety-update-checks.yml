name: Safety and update feature checks

on:
  push:
    branches:
      - 'feat/**'
    paths:
      - 'system/bin/luoshu-health'
      - 'scripts/system_health_test.sh'
      - 'scripts/sync_update_metadata.py'
      - 'scripts/sync_update_metadata_test.py'
      - 'update-prerelease.json'
      - '.github/workflows/sync-update-metadata.yml'
      - '.github/workflows/feature-safety-update-checks.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'system/bin/luoshu-health'
      - 'scripts/system_health_test.sh'
      - 'scripts/sync_update_metadata.py'
      - 'scripts/sync_update_metadata_test.py'
      - 'update-prerelease.json'
      - '.github/workflows/sync-update-metadata.yml'
      - '.github/workflows/feature-safety-update-checks.yml'

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate health and update metadata helpers
        run: |
          sh -n system/bin/luoshu-health
          sh scripts/system_health_test.sh
          python3 -m py_compile scripts/sync_update_metadata.py
          python3 scripts/sync_update_metadata_test.py
