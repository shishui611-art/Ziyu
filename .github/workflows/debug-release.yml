name: Publish Debug Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ziyu-debug-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  debug-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: ''

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends curl unzip zip file python3-venv fonts-noto-cjk fonts-dejavu-core >/dev/null

      - uses: actions/cache@v4
        with:
          path: |
            common/python
            .luoshu-runtime/bin/woff2_decompress
            licenses/WOFF2-LICENSE.txt
            licenses/Brotli-LICENSE.txt
          key: luoshu-arm64-runtime-${{ runner.os }}-${{ hashFiles('scripts/prepare_composite_runtime.sh') }}

      - name: Prepare ARM64 composite runtime
        run: |
          if [ ! -x common/python/bin/luoshu-python ] || [ ! -x .luoshu-runtime/bin/woff2_decompress ] || [ ! -s licenses/WOFF2-LICENSE.txt ] || [ ! -s licenses/Brotli-LICENSE.txt ]; then
            sh ./scripts/prepare_composite_runtime.sh
          fi

      - name: Run source checks
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/ziyu-source-check.log"
          if ! sh -x ./scripts/check.sh >"$log" 2>&1; then
            tail -n 140 "$log" >&2
            exit 1
          fi
          cat "$log"

      - name: Load existing release signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.LUOSHU_KEYSTORE_BASE64 }}
          LUOSHU_KEYSTORE_PASSWORD: ${{ secrets.LUOSHU_KEYSTORE_PASSWORD }}
          LUOSHU_KEY_ALIAS: ${{ secrets.LUOSHU_KEY_ALIAS }}
          LUOSHU_KEY_PASSWORD: ${{ secrets.LUOSHU_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 LUOSHU_KEYSTORE_PASSWORD LUOSHU_KEY_ALIAS LUOSHU_KEY_PASSWORD; do
            [[ -n "${!name}" ]] || { echo "Missing signing secret: $name" >&2; exit 3; }
          done
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/luoshu-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/luoshu-release.jks" -storepass:env LUOSHU_KEYSTORE_PASSWORD -alias "$LUOSHU_KEY_ALIAS" >/dev/null

      - name: Build Debug App with release identity
        working-directory: android-app
        env:
          LUOSHU_KEYSTORE_FILE: ${{ runner.temp }}/luoshu-release.jks
          LUOSHU_KEYSTORE_PASSWORD: ${{ secrets.LUOSHU_KEYSTORE_PASSWORD }}
          LUOSHU_KEY_ALIAS: ${{ secrets.LUOSHU_KEY_ALIAS }}
          LUOSHU_KEY_PASSWORD: ${{ secrets.LUOSHU_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace :app:lintDebug :app:testDebugUnitTest :app:assembleDebug

      - name: Verify shared App signing certificate
        shell: bash
        env:
          EXPECTED_CERT_SHA256: ebfd6167fe727ab3ada7dd5cf44dc3d3c345812fab4f6d5699f69ea572688468
        run: |
          set -euo pipefail
          apk='android-app/app/build/outputs/apk/debug/app-debug.apk'
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          test -x "$apksigner"
          "$apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/debug-signature.txt"
          actual_cert="$(awk -F': ' '/Signer.*certificate SHA-256 digest:/ {print $NF; exit}' "$RUNNER_TEMP/debug-signature.txt" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          [[ "$actual_cert" == "$EXPECTED_CERT_SHA256" ]] || { echo 'Debug signing certificate does not match release.' >&2; exit 3; }

      - name: Package Debug module and checksums
        shell: bash
        run: |
          set -euo pipefail
          . ./scripts/version.sh
          apk='android-app/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$apk"
          LUOSHU_APP_APK="$apk" LUOSHU_APP_PACKAGE=io.github.shishui611_art.ziyu LUOSHU_ALLOW_DEBUG_APP=1 sh ./scripts/build.sh

          short_sha="${GITHUB_SHA:0:7}"
          module="dist/Ziyu-${LUOSHU_ARTIFACT_VERSION}.zip"
          debug_module="dist/Ziyu-${LUOSHU_ARTIFACT_VERSION}-Debug-${short_sha}.zip"
          mv "$module" "$debug_module"
          (cd dist && sha256sum "$(basename "$debug_module")" > "$(basename "$debug_module").sha256")

          unzip -t "$debug_module" >/dev/null
          test "$(unzip -p "$debug_module" bundled/app.prop | sed -n 's/^package=//p')" = 'io.github.shishui611_art.ziyu'
          test "$(unzip -p "$debug_module" bundled/Ziyu-App.apk | sha256sum | awk '{print $1}')" = "$(sha256sum "$apk" | awk '{print $1}')"

          echo "DEBUG_MODULE=$debug_module" >> "$GITHUB_ENV"
          echo "DEBUG_TAG=ziyu-debug-${LUOSHU_ARTIFACT_VERSION}-${GITHUB_RUN_NUMBER}-${short_sha}" >> "$GITHUB_ENV"
          echo "DEBUG_VERSION=$LUOSHU_ARTIFACT_VERSION" >> "$GITHUB_ENV"

      - name: Publish GitHub Debug pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: '1'
        run: |
          gh release create "$DEBUG_TAG" \
            "$DEBUG_MODULE" "${DEBUG_MODULE}.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "字域 ${DEBUG_VERSION} Debug 测试版 (${GITHUB_RUN_NUMBER})" \
            --prerelease \
            --notes $'此版本由 GitHub Actions 云端构建，供调试和手动测试。\n\n内置 Debug App 与正式版使用相同包名和已有正式签名，覆盖安装保留正式 App 数据；历史独立 .debug App 可手动卸载一次。本次仍是 Debug 预发布，不写入正式更新清单。安装前请先备份当前字体配置；遇到异常可在 Root 管理器中停用模块。'
