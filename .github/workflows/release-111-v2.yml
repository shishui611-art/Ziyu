name: Publish signed release
on:
  push:
    branches: [release/2.0.0-111]
permissions:
  contents: read
  actions: read
concurrency:
  group: luoshu-stable-v2-111
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: v2-signed-candidate
          run-id: 36435160874
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/signed
      - name: Bind signed APK to the verified Android source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          src=b05edddb1f372b1441bd0063929d534c31a1cada
          test "$(gh api repos/${GITHUB_REPOSITORY}/actions/jobs/108971134030 --jq .conclusion)" = success
          test "$(cat "$RUNNER_TEMP/signed/verification/commit.txt")" = "$src"
          changes=$(git diff --name-only "$src" HEAD -- | grep -Ev '^(\.github/workflows/|scripts/font_library_ui_layout_test\.sh$|scripts/v2_flashing_ui_smoke\.py$)' || true)
          test -z "$changes" || { printf 'Unverified runtime changes: %s\n' "$changes"; exit 2; }
          echo '57d86a4b5d87a7baf2f4cba8c13fcabb940ffd6d00f662d2313d91da2f4950b8  '"$RUNNER_TEMP/signed/verification/LuoShu-App-v2.0.0.apk" | sha256sum -c -
          grep -q 'certificate SHA-256 digest: e0043b560a10111d3ffddd3a7afba680b854e14ed793c7a3fdb7f8b7aa95ff27' "$RUNNER_TEMP/signed/verification/signature.txt"
          grep -q "name='io.github.xgl34222220.luoshu' versionCode='7000001' versionName='2.0.0'" "$RUNNER_TEMP/signed/verification/apk-badging.txt"
      - name: Prepare reproducible module runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-dejavu-core python3-venv zip unzip file >/dev/null
          curl -fL --retry 2 --max-time 120 https://github.com/xgl34222220-ops/LuoShu/releases/download/refactor-v1.1.1/LuoShu-v1.1.1.zip -o "$RUNNER_TEMP/baseline.zip"
          echo 'c5c8fa86af4ac196107ba05c5ee8cc1944140ae033cc9e763cec8c76f40c848a  '"$RUNNER_TEMP/baseline.zip" | sha256sum -c -
          unzip -oq "$RUNNER_TEMP/baseline.zip" 'common/python/*'
          chmod +x common/python/bin/luoshu-python
      - name: Full backend checks and package
        shell: bash
        env:
          LUOSHU_APP_PACKAGE: io.github.xgl34222220.luoshu
          LUOSHU_APP_VERSION_CODE: '7000001'
        run: |
          set -euo pipefail
          mkdir -p verification dist
          git rev-parse HEAD > verification/commit.txt
          export LUOSHU_APP_APK="$RUNNER_TEMP/signed/verification/LuoShu-App-v2.0.0.apk"
          sh scripts/build.sh 2>&1 | tee verification/full-backend-and-package.log
          cp "$LUOSHU_APP_APK" dist/LuoShu-App-v2.0.0.apk
          (cd dist && sha256sum LuoShu-App-v2.0.0.apk > LuoShu-App-v2.0.0.apk.sha256 && sha256sum -c LuoShu-v2.0.0.zip.sha256 && sha256sum -c LuoShu-App-v2.0.0.apk.sha256)
          unzip -p dist/LuoShu-v2.0.0.zip bundled/LuoShu-App.apk > "$RUNNER_TEMP/embedded.apk"
          cmp "$LUOSHU_APP_APK" "$RUNNER_TEMP/embedded.apk"
          cp "$RUNNER_TEMP/signed/verification/signature.txt" verification/
          cp "$RUNNER_TEMP/signed/verification/apk-badging.txt" verification/
          git archive --format=zip HEAD > dist/LuoShu-v2.0.0-source.zip
      - name: Enforce authorized release readiness without claiming device tests
        shell: bash
        run: |
          set -euo pipefail
          grep -qx 'version=v2.0.0' config/stable_release_authorization.conf
          grep -qx 'scope=stable-release' config/stable_release_authorization.conf
          grep -qx 'allowPendingDeviceMatrix=true' config/stable_release_authorization.conf
          echo '::warning::Maintainer authorized this stable release with Android OEM device validation pending. No device result is being fabricated.'
          sh scripts/pre_release_readiness.sh --target v2.0.0 --enforce
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LuoShu-v2.0.0-verified-release
          path: |
            dist/
            verification/
          retention-days: 14
  smoke:
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: LuoShu-v2.0.0-verified-release
          path: candidate
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable emulator KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Real signed App navigation and flashing-page captures
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          ram-size: 2048M
          heap-size: 512M
          emulator-boot-timeout: 600
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: python3 scripts/v2_flashing_ui_smoke.py --apk candidate/dist/LuoShu-App-v2.0.0.apk --package io.github.xgl34222220.luoshu --output ui-smoke-output --serial emulator-5554
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LuoShu-v2.0.0-signed-UI-smoke
          path: ui-smoke-output/
          retention-days: 14
  publish:
    needs: [package, smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: LuoShu-v2.0.0-verified-release
          path: candidate
      - name: Publish immutable v2.0.0 stable assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(cat candidate/verification/commit.txt)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/release/2.0.0-111 | cut -f1)" = "$GITHUB_SHA"
          test -z "$(git ls-remote origin refs/tags/refactor-v2.0.0)"
          if gh release view refactor-v2.0.0 >/dev/null 2>&1; then echo 'Release already exists; will not overwrite.' >&2; exit 4; fi
          (cd candidate/dist && sha256sum -c LuoShu-v2.0.0.zip.sha256 && sha256sum -c LuoShu-App-v2.0.0.apk.sha256)
          gh release create refactor-v2.0.0 candidate/dist/LuoShu-v2.0.0.zip candidate/dist/LuoShu-v2.0.0.zip.sha256 candidate/dist/LuoShu-App-v2.0.0.apk candidate/dist/LuoShu-App-v2.0.0.apk.sha256 --target "$GITHUB_SHA" --title '洛书 2.0.0 正式版' --notes-file 更新日志/RELEASE_NOTES_refactor-v2.0.0.md --latest
          gh api repos/${GITHUB_REPOSITORY}/releases/tags/refactor-v2.0.0 --jq '{tag_name,draft,prerelease,assets:[.assets[].name]}'
