name: Publish signed release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - 'refactor-v*'
      - 'ziyu-v*'
    paths:
      - module.prop
      - .github/workflows/release.yml
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable tag to publish (for example ziyu-v1.0.0)
        required: true
        type: string
      prerelease:
        description: Publish as a GitHub pre-release
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ziyu-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Resolve immutable release source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      mode: ${{ steps.version.outputs.mode }}
      version: ${{ steps.version.outputs.version }}
      release_title: ${{ steps.version.outputs.release_title }}
      artifact_version: ${{ steps.version.outputs.artifact_version }}
      notes_file: ${{ steps.version.outputs.notes_file }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      source_sha: ${{ steps.version.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read and verify release version
        id: version
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          . ./scripts/version.sh
          expected_tag="$ZIYU_RELEASE_TAG"
          tag="${GITHUB_REF_NAME}"
          mode="tag"
          source_sha="$GITHUB_SHA"
          git fetch --force --tags origin

          if [[ "${GITHUB_EVENT_NAME}" == 'workflow_dispatch' ]]; then
            tag="$INPUT_TAG"
            mode="existing-tag"
            tag_sha="$(git rev-list -n1 "$tag" 2>/dev/null || true)"
            [[ -n "$tag_sha" ]] || { echo "Tag does not exist: $tag" >&2; exit 2; }
            [[ "$tag_sha" == "$GITHUB_SHA" ]] || { echo "Run this workflow from the existing tag $tag" >&2; exit 2; }
            source_sha="$tag_sha"
          elif [[ "${GITHUB_REF_TYPE}" == 'branch' ]]; then
            [[ "${GITHUB_REF_NAME}" == 'main' ]] || { echo "Stable branch publishing only supports main" >&2; exit 2; }
            tag="$expected_tag"
            [[ "$(git rev-parse origin/main)" == "$GITHUB_SHA" ]] || {
              echo "A newer main commit is already queued; refusing this stale candidate." >&2
              exit 4
            }
            tag_sha="$(git rev-list -n1 "$tag" 2>/dev/null || true)"
            if [[ -z "$tag_sha" ]]; then
              mode="create-tag"
            else
              git merge-base --is-ancestor "$tag_sha" "$GITHUB_SHA" || {
                echo "Existing tag is not an ancestor of main: $tag -> $tag_sha" >&2
                exit 2
              }
              disallowed_changes="$(git diff --name-only "$tag_sha" "$GITHUB_SHA" -- | grep -Ev '^(更新日志/RELEASE_NOTES_.*\.md|\.github/workflows/release\.yml)$' || true)"
              [[ -z "$disallowed_changes" ]] || {
                echo "Existing tag differs from main by non-release files:" >&2
                printf '%s\n' "$disallowed_changes" >&2
                exit 2
              }
              mode="existing-tag"
              source_sha="$tag_sha"
            fi
          else
            tag_sha="$(git rev-list -n1 "$tag" 2>/dev/null || true)"
            [[ -n "$tag_sha" && "$tag_sha" == "$GITHUB_SHA" ]] || {
              echo "Tag checkout does not match GITHUB_SHA: $tag" >&2
              exit 2
            }
            source_sha="$tag_sha"
          fi

          [[ "$tag" == "$expected_tag" ]] || {
            echo "Tag $tag does not match module.prop ($expected_tag)" >&2
            exit 2
          }
          notes_file="$ZIYU_RELEASE_NOTES"
          [[ -s "$notes_file" ]] || { echo "Missing release notes: $notes_file" >&2; exit 2; }
          prerelease="${INPUT_PRERELEASE:-false}"
          if grep -q '<!-- prerelease -->' "$notes_file"; then
            prerelease="true"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "version=$ZIYU_VERSION" >> "$GITHUB_OUTPUT"
          echo "release_title=$ZIYU_RELEASE_TITLE" >> "$GITHUB_OUTPUT"
          echo "artifact_version=$ZIYU_ARTIFACT_VERSION" >> "$GITHUB_OUTPUT"
          echo "notes_file=$notes_file" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

          if [[ "$source_sha" != "$GITHUB_SHA" ]]; then
            git checkout --detach "$source_sha"
          fi

  app:
    name: Build and sign Android App
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      artifact_name: ${{ steps.signed-app.outputs.artifact_name }}
      apk_sha256: ${{ steps.signed-app.outputs.apk_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: ''

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Require signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ZIYU_KEYSTORE_BASE64 || secrets.LUOSHU_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ZIYU_KEYSTORE_PASSWORD || secrets.LUOSHU_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ZIYU_KEY_ALIAS || secrets.LUOSHU_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ZIYU_KEY_PASSWORD || secrets.LUOSHU_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [[ -n "${!value}" ]] || { echo "Missing repository secret: ZIYU_${value}" >&2; exit 3; }
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ziyu-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/ziyu-release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

      - name: Build signed release App
        working-directory: android-app
        env:
          ZIYU_KEYSTORE_FILE: ${{ runner.temp }}/ziyu-release.jks
          ZIYU_KEYSTORE_PASSWORD: ${{ secrets.ZIYU_KEYSTORE_PASSWORD || secrets.LUOSHU_KEYSTORE_PASSWORD }}
          ZIYU_KEY_ALIAS: ${{ secrets.ZIYU_KEY_ALIAS || secrets.LUOSHU_KEY_ALIAS }}
          ZIYU_KEY_PASSWORD: ${{ secrets.ZIYU_KEY_PASSWORD || secrets.LUOSHU_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Verify APK signature certificate
        id: signed-app
        shell: bash
        env:
          EXPECTED_CERT_SHA256: ebfd6167fe727ab3ada7dd5cf44dc3d3c345812fab4f6d5699f69ea572688468
        run: |
          set -euo pipefail
          apk='android-app/app/build/outputs/apk/release/app-release.apk'
          test -s "$apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          test -x "$apksigner"
          "$apksigner" verify --verbose --print-certs "$apk" | tee "$RUNNER_TEMP/apk-signature.txt"
          grep -Eq '^Verified using v(2|3|3\.1|3\.2) scheme.*: true$' "$RUNNER_TEMP/apk-signature.txt"
          grep -qx 'Number of signers: 1' "$RUNNER_TEMP/apk-signature.txt"
          actual_cert="$(
            awk -F': ' '/Signer.*certificate SHA-256 digest:/ {print $NF; exit}' \
              "$RUNNER_TEMP/apk-signature.txt" |
              tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]'
          )"
          [[ "$actual_cert" == "$EXPECTED_CERT_SHA256" ]] || {
            echo "Release certificate mismatch: $actual_cert" >&2
            exit 3
          }

          echo "artifact_name=ziyu-signed-apk-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

          echo "apk_sha256=$(sha256sum "$apk" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Preserve verified signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.signed-app.outputs.artifact_name }}
          path: android-app/app/build/outputs/apk/release/app-release.apk
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

      - name: Preserve failing Android diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ziyu-android-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            android-app/app/build/reports
            android-app/app/build/test-results
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Verify package and publish release
    needs: [prepare, app]
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install module build dependencies
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for package in curl unzip zip file python3-venv; do
            if ! dpkg-query -W -f='${Status}' "$package" 2>/dev/null | grep -qx 'install ok installed'; then
              missing+=("$package")
            fi
          done
          if (( ${#missing[@]} )); then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends "${missing[@]}" >/dev/null
          fi

      - uses: actions/cache/restore@v4
        id: runtime-cache
        with:
          path: |
            common/python
            .ziyu-runtime/bin/woff2_decompress
            licenses/WOFF2-LICENSE.txt
            licenses/Brotli-LICENSE.txt
          key: ziyu-arm64-runtime-${{ runner.os }}-${{ hashFiles('scripts/prepare_composite_runtime.sh') }}

      - name: Prepare ARM64 composite runtime
        shell: bash
        run: |
          if [[ ! -x common/python/bin/ziyu-python || ! -x .ziyu-runtime/bin/woff2_decompress || ! -s licenses/WOFF2-LICENSE.txt || ! -s licenses/Brotli-LICENSE.txt ]]; then
            sh ./scripts/prepare_composite_runtime.sh
          fi

      - name: Download verified signed APK
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.app.outputs.artifact_name }}
          path: android-app/app/build/outputs/apk/release

      - name: Verify downloaded APK matches signed build
        shell: bash
        env:
          EXPECTED_APK_SHA256: ${{ needs.app.outputs.apk_sha256 }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_APK_SHA256" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  %s\n' "$EXPECTED_APK_SHA256" android-app/app/build/outputs/apk/release/app-release.apk | sha256sum -c -

      - name: Summarize changes since the previous stable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          set -euo pipefail
          PREVIOUS_TAG="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)"
          PREVIOUS_VERSION=""
          if [[ -n "$PREVIOUS_TAG" ]]; then
            PREVIOUS_VERSION="$(git show "$PREVIOUS_TAG:module.prop" 2>/dev/null | sed -n 's/^version=//p' | head -n1 || true)"
          fi
          export PREVIOUS_TAG PREVIOUS_VERSION
          python3 scripts/release_notes_since.py > "$RUNNER_TEMP/ziyu-release-notes.md"

      - name: Build App and single module package
        shell: bash
        run: |
          set -euo pipefail
          . ./scripts/version.sh
          apk='android-app/app/build/outputs/apk/release/app-release.apk'
          test -s "$apk"
          [[ "$(apkanalyzer manifest application-id "$apk")" == 'io.github.shishui611_art.ziyu' ]]
          [[ "$(apkanalyzer manifest version-code "$apk")" == "$ZIYU_APP_VERSION_CODE" ]]
          [[ "$(apkanalyzer manifest version-name "$apk")" == "${ZIYU_VERSION#v}" ]]
          mkdir -p dist
          app="dist/Ziyu-App-${ZIYU_ARTIFACT_VERSION}.apk"
          cp -f "$apk" "$app"
          (cd dist && sha256sum "$(basename "$app")" > "$(basename "$app").sha256")
          ZIYU_APP_PACKAGE=io.github.shishui611_art.ziyu ZIYU_APP_VERSION_NAME="${ZIYU_VERSION#v}" \
            ZIYU_APP_APK="$apk" sh ./scripts/build_debug_fast.sh
          module="dist/Ziyu-${ZIYU_ARTIFACT_VERSION}.zip"
          test -s "$module"
          unzip -t "$module" >/dev/null
          unzip -Z1 "$module" | grep -qx 'bundled/Ziyu-App.apk'
          ! unzip -Z1 "$module" | grep -qE '(^|/)webroot(/|$)'
          unzip -p "$module" bundled/Ziyu-App.apk > "$RUNNER_TEMP/embedded.apk"
          cmp -s "$apk" "$RUNNER_TEMP/embedded.apk"
          (cd dist && sha256sum -c "$(basename "$module").sha256")
          (cd dist && sha256sum -c "$(basename "$app").sha256")

      - name: Preserve verified release candidate
        uses: actions/upload-artifact@v4
        with:
          name: Ziyu-${{ needs.prepare.outputs.artifact_version }}-verified-release
          path: |
            dist/Ziyu-${{ needs.prepare.outputs.artifact_version }}.zip
            dist/Ziyu-${{ needs.prepare.outputs.artifact_version }}.zip.sha256
            dist/Ziyu-App-${{ needs.prepare.outputs.artifact_version }}.apk
            dist/Ziyu-App-${{ needs.prepare.outputs.artifact_version }}.apk.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          MODE: ${{ needs.prepare.outputs.mode }}
          VERSION: ${{ needs.prepare.outputs.version }}
          ARTIFACT_VERSION: ${{ needs.prepare.outputs.artifact_version }}
          NOTES_FILE: ${{ runner.temp }}/ziyu-release-notes.md
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          RELEASE_TITLE: ${{ needs.prepare.outputs.release_title }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          if [[ "$MODE" == 'create-tag' ]]; then
            git fetch origin main
            main_sha="$(git rev-parse origin/main)"
            [[ "$main_sha" == "$GITHUB_SHA" ]] || {
              echo "main moved after validation: $main_sha != $GITHUB_SHA" >&2
              exit 4
            }
            [[ -z "$(git rev-list -n1 "$TAG" 2>/dev/null || true)" ]] || {
              echo "Tag appeared during validation: $TAG" >&2
              exit 4
            }
          elif gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; immutable releases are never overwritten." >&2
            exit 4
          fi

          module="dist/Ziyu-${ARTIFACT_VERSION}.zip"
          module_sha="${module}.sha256"
          for file in "$module" "$module_sha"; do test -s "$file"; done

          prerelease=()
          case "$VERSION" in *Alpha*|*Beta*|*RC*) prerelease=(--prerelease) ;; esac
          if [[ "$PRERELEASE" == 'true' ]]; then
            prerelease=(--prerelease)
          fi
          tag_mode=(--verify-tag)
          if [[ "$MODE" == 'create-tag' ]]; then
            tag_mode=(--target "$SOURCE_SHA")
          fi
          latest=(--latest)
          if [[ "${#prerelease[@]}" -gt 0 ]]; then latest=(--latest=false); fi
          gh release create "$TAG" "$module" "$module_sha" "dist/Ziyu-App-${ARTIFACT_VERSION}.apk" "dist/Ziyu-App-${ARTIFACT_VERSION}.apk.sha256" \
            "${tag_mode[@]}" \
            --title "$RELEASE_TITLE" \
            --notes-file "$NOTES_FILE" \
            "${prerelease[@]}" "${latest[@]}"
